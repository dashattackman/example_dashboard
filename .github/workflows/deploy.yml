name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/superhero-rpg-game-design-6imc0c]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        working-directory: game
        run: npm ci
      - name: Unit tests
        working-directory: game
        run: npm test
      - name: Build
        working-directory: game
        env:
          BASE_PATH: /example_dashboard/
        run: npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: game/dist
