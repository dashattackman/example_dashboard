name: CI

# Deploys are handled by Cloudflare Pages (connected to this repo).
# This workflow is the merge gate: unit tests + production build must pass.

on:
  push:
    branches: [claude/superhero-rpg-game-design-6imc0c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        working-directory: game
        run: npm ci
      - name: Unit tests
        working-directory: game
        run: npm test
      - name: Build
        working-directory: game
        run: npm run build
