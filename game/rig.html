<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Twin Cities — character rig harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14213d;
        font-family: system-ui, sans-serif;
      }
      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #rig-hud {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #ffcf8a;
        font-size: 12px;
        opacity: 0.85;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <!-- Standalone art/anim review page — NOT part of the game boot path.
         Playwright (test/e2e/characterRig.spec.ts) drives it via window.__rig. -->
    <canvas id="game-canvas"></canvas>
    <div id="rig-hud"></div>
    <script type="module" src="/src/engine/rigHarness.ts"></script>
  </body>
</html>
